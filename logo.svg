<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Emblem Primary Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Accent Energy Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Squircle Badge -->
  <rect x="12" y="12" width="176" height="176" rx="44" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Sleek Border Ring -->
  <rect x="12" y="12" width="176" height="176" rx="44" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- Subtle Geometric Grid / Circuit Accent -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" stroke-dasharray="4 6" />

  <g filter="url(#neonGlow)">
    <!-- Letter 'I' Pillar -->
    <rect x="62" y="58" width="16" height="84" rx="8" fill="url(#emblemGrad)" />
    <!-- 'I' Dot / Power Node -->
    <circle cx="70" cy="44" r="7" fill="#38bdf8" />

    <!-- Letter 'C' Swoop -->
    <path d="M 148 68 C 134 50 106 48 92 62 C 86 67 82 76 82 85 L 82 115 C 82 124 86 133 92 138 C 106 152 134 150 148 132" 
          fill="none" 
          stroke="url(#emblemGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Electrotechnics / Energy Bolt Spark inside C -->
    <path d="M 124 80 L 112 101 L 122 101 L 110 122 L 132 95 L 122 95 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Decorative Corner Nodes -->
  <circle cx="152" cy="48" r="3.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="48" cy="152" r="2.5" fill="#818cf8" opacity="0.6" />
</svg>
